<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音声比較実験</title>
    <style>
      body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 2rem; }
      label, button { font-size: 1rem; }
      .field { margin-bottom: 1rem; }
      .alert { padding: 1rem; border: 1px solid #d33; background: #fdd; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>音声比較実験</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="field">
        <label for="name">氏名</label><br />
        <input id="name" name="name" type="text" required style="width:100%; padding:0.5rem;" />
      </div>
      <div class="field">
        <label>WAVファイル名を表示する</label><br />
        <label><input type="radio" name="show_names" value="show" checked> 表示する</label><br />
        <label><input type="radio" name="show_names" value="hide"> 表示しない</label>
      </div>
      <button type="submit">実験を開始する</button>
    </form>
  </body>
</html>
