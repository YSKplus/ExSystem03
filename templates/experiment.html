<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>実験 - {{ name }}</title>
    <style>
      body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 2rem; }
      .section { margin-bottom: 1.5rem; }
      .rating button { margin: 0.2rem; min-width: 3rem; height: 3rem; }
      .audio-block { margin-bottom: 1rem; }
      .note { color: #555; }
    </style>
  </head>
  <body>
    <h1>実験中</h1>
    <div class="section">
      <p>参加者: <strong>{{ name }}</strong></p>
      <p>試行 {{ trial }} / {{ total }}</p>
      <p class="note">両方の音声の再生が終了したら評価ボタンが有効になります。</p>
    </div>

    <div class="section audio-block">
      <h2>音声 A</h2>
      <audio id="audioA" controls preload="none">
        <source src="{{ url_for('serve_wav', filename=file_a) }}" type="audio/wav" />
        お使いのブラウザは audio 要素に対応していません。
      </audio>
    </div>

    <div class="section audio-block">
      <h2>音声 B</h2>
      <audio id="audioB" controls preload="none">
        <source src="{{ url_for('serve_wav', filename=file_b) }}" type="audio/wav" />
        お使いのブラウザは audio 要素に対応していません。
      </audio>
    </div>

    <form id="ratingForm" method="post" action="{{ url_for('submit', session_id=session_id) }}">
      <input type="hidden" name="rating" id="ratingInput" />
      <div class="rating">
        {% for i in range(1, 8) %}
          <button type="button" onclick="submitRating({{ i }})" disabled>{{ i }}</button>
        {% endfor %}
      </div>
    </form>

    <form id="abortForm" method="post" action="{{ url_for('abort', session_id=session_id) }}">
      <button type="button" onclick="confirmAbort()">実験途中終了</button>
    </form>

    <script>
      const audioA = document.getElementById('audioA');
      const audioB = document.getElementById('audioB');
      const ratingButtons = Array.from(document.querySelectorAll('.rating button'));
      const ratingInput = document.getElementById('ratingInput');
      let endedA = false;
      let endedB = false;
      let allowLeave = false;

      const enableButtons = () => {
        if (endedA && endedB) {
          ratingButtons.forEach(btn => btn.disabled = false);
        }
      };

      const markSafeToLeave = () => {
        allowLeave = true;
      };

      window.addEventListener('beforeunload', (event) => {
        if (!allowLeave) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      audioA.addEventListener('ended', () => {
        endedA = true;
        fetch('{{ url_for('count_play', session_id=session_id) }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: '{{ file_a }}' }),
        });
        enableButtons();
      });

      audioB.addEventListener('ended', () => {
        endedB = true;
        fetch('{{ url_for('count_play', session_id=session_id) }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: '{{ file_b }}' }),
        });
        enableButtons();
      });

      const submitRating = (value) => {
        ratingInput.value = value;
        markSafeToLeave();
        document.getElementById('ratingForm').submit();
      };

      const confirmAbort = () => {
        if (confirm('本当に実験を途中終了しますか？途中までの結果が保存されます。')) {
          markSafeToLeave();
          document.getElementById('abortForm').submit();
        }
      };
    </script>
  </body>
</html>
